<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CursorProject</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4ef;
      --ink: #1c1915;
      --muted: #5c564c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161411;
        --ink: #f4f0e8;
        --muted: #b7b0a4;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      padding: 2rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>hello there</h1>
    <p>CursorProject</p>
  </main>
</body>
</html>
